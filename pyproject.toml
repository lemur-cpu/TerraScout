[project]
name = "terra-scout"
version = "0.1.0"
description = "Evidence-driven LiDAR and DEM research platform for archaeological landscape anomalies"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Courtney Quinn", email = "courtney.quinn320@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.27",
    "streamlit>=1.40",
    "folium>=0.18",
    "matplotlib>=3.9",
    "pillow>=11.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
ml = [
    "torch>=2.5",
]
lidar = [
    "pdal>=3.4",
]

[project.scripts]
terra-scout = "terra_scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "network: tests that call live public geospatial APIs",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/terra_scout/cli.py" = ["B008"]
"src/terra_scout/coverage_cli.py" = ["B008"]
